
<!-- Cabecalho -->
<head th:fragment="cabecalho(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${titulo}">Título</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <!-- se tiver CSS local -->
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>

<!-- outros fragments -->


<!--Home-->
<button th:fragment="voltarHome" type="button" class="px-3 md:px-6 py-2 rounded-xl text-white shadow-md bg-gradient-to-r from-blue-500 to-blue-700 text-sm md:text-base">
  <a href="/home"><b>Voltar para Home</b></a>
</button>

<!--Background screen-->
<style th:fragment="backgroudScreen">
  body {
    background-color: #D7DFD9;
    background-image: radial-gradient(rgba(8, 200, 38, 0.2) 0.2px, transparent 1px);
    background-size: 25px 25px;
  }
</style>


<!-- Logout -->
<form th:fragment="form-logout" th:action="@{/logout}" method="post">
  <button type="submit" class="px-3 md:px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 transition duration-200 text-sm md:text-base">
    <i class="fas fa-sign-out-alt mr-1"></i>
    Logout
  </button>
</form>

<!-- Cancelar -->
<button th:fragment="botao-cancelar" type="button" class="px-4 md:px-6 py-2 md:py-3 bg-gray-500 hover:bg-gray-600 text-white rounded-lg font-semibold transition duration-200 text-sm md:text-base">
  <i class="fas fa-times mr-2"></i>
  Cancelar
</button>

<!-- Salvar -->
<button th:fragment="botao-salvar" type="submit" class="px-4 md:px-6 py-2 md:py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-semibold transition duration-200 text-sm md:text-base">
  <i class="fas fa-save mr-2"></i>
  Salvar
</button>


<!-- Rodapé -->
<footer th:fragment="rodape" class="bg-green-500 w-full flex flex-col md:flex-row items-center justify-center gap-4 py-3 px-4 mt-auto">
  <div class="text-center md:text-right">
    <p class="text-gray-950 text-xs md:text-sm">&copy; 2025 - Yard Flow</p>
    <p class="text-gray-950 text-xs md:text-sm">yardflow@devforge.com.br</p>
  </div>

  <div class="flex items-center gap-2">
    <img th:src="@{/img/logoDF.png}" alt="logoYF" class="h-6 md:h-8 w-auto" />
    <p class="text-gray-950 text-xs md:text-sm font-bold">· DEV · FORGE ·</p>
  </div>
</footer>
